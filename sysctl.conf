########## Kernel ##########

# Replace kernel pointers printed with %pK with zeros, even for privileged readers.
kernel.kptr_restrict = 2

# Require CAP_SYSLOG to read the kernel log buffer.
kernel.dmesg_restrict = 1

# Block new ptrace tracing even for root; this cannot be relaxed until reboot.
# Breaks debugger attachment, strace, and applications that depend on ptrace.
kernel.yama.ptrace_scope = 3

# Disable SysRq key commands; privileged access through /proc/sysrq-trigger remains available.
kernel.sysrq = 0

# Restrict unprivileged perf access; upstream treats 3 like 2 and still permits user-space events.
kernel.perf_event_paranoid = 3

# Use a 1% CPU-time budget for adaptive perf sampling throttling.
kernel.perf_cpu_time_max_percent = 1

# Cap requested perf sampling frequencies at 1 Hz.
kernel.perf_event_max_sample_rate = 1

# Block unprivileged bpf() calls until reboot.
kernel.unprivileged_bpf_disabled = 1

# Harden BPF JIT compilation for all users to mitigate JIT spraying, at a performance cost.
net.core.bpf_jit_harden = 2

# Block new io_uring instances for all users; existing instances remain usable.
# Applications may fail or lose I/O performance; QEMU with aio=io_uring needs another backend.
#kernel.io_uring_disabled = 2

# Block unprivileged user-namespace creation; requires a distribution-specific kernel patch.
# Can break application sandboxes and rootless containers.
#kernel.unprivileged_userns_clone = 0

# Disable new user namespaces for all users, including privileged processes.
# Can break application sandboxes and rootless containers.
#user.max_user_namespaces = 0

# Use the maximum PID allocation range supported by 64-bit kernels.
kernel.pid_max = 4194304

# Block loading new kexec images until reboot; images loaded earlier remain usable.
kernel.kexec_load_disabled = 1

# Block module loading and unloading until reboot.
# Enable only after required modules are loaded; later hardware or feature activation may fail.
#kernel.modules_disabled = 1

# Restrict kernel user-mode helper capabilities to CAP_SYS_MODULE for module loading.
# Other helpers or module install commands may fail; restrictions cannot be relaxed until reboot.
#kernel.usermodehelper.bset = 65536 0
#kernel.usermodehelper.inheritable = 65536 0

# Reboot 10 seconds after a kernel panic.
kernel.panic = 10

# Panic after the first kernel oops; this does not itself enable automatic reboot.
kernel.oops_limit = 1

# Panic after the first kernel warning.
#kernel.warn_limit = 1

########## Virtual Memory ##########

# Enable address randomization, including the stack, memory mappings, VDSO, and heap.
kernel.randomize_va_space = 2

# Use 32 bits of mmap randomization for native processes and 16 bits for compatibility processes.
# Requires a kernel and architecture that support these entropy values.
vm.mmap_rnd_bits = 32
vm.mmap_rnd_compat_bits = 16

# Prevent unprivileged mappings below 64 KiB to hinder NULL-pointer exploits.
vm.mmap_min_addr = 65536

# Erase used kernel stack data on syscall return to reduce information leaks.
# Requires CONFIG_KSTACK_ERASE and CONFIG_KSTACK_ERASE_RUNTIME_DISABLE.
kernel.stack_erasing = 1

# Require new memfds to be sealed against file execution; MFD_EXEC requests fail.
# Applications may fail or use weaker fallbacks; executable memory mappings remain possible.
#vm.memfd_noexec = 2

# Restrict unprivileged userfaultfd() calls to faults from user mode.
# Access through /dev/userfaultfd is controlled by device permissions instead.
vm.unprivileged_userfaultfd = 0

########## Core Dumps ##########

# Disable automatic core dumps for processes that change privileges or run unreadable binaries.
fs.suid_dumpable = 0

# Keep PID suffixes disabled so an empty core_pattern cannot produce .PID files.
kernel.core_uses_pid = 0

# Leave the pattern empty to suppress core files and core-dump helpers.
kernel.core_pattern =

########## File System ##########

# Restrict hard links to files the caller owns or may safely read and write.
fs.protected_hardlinks = 1

# Restrict following other users' symlinks in sticky, world-writable directories.
fs.protected_symlinks = 1

# Restrict O_CREAT opens of others' FIFOs in sticky group- or world-writable directories.
fs.protected_fifos = 2

# Restrict O_CREAT opens of others' regular files in sticky group- or world-writable directories.
fs.protected_regular = 2

# Remove the practical system-wide file-handle ceiling; per-process limits still apply.
fs.file-max = 9223372036854775807

# Allow up to 524288 inotify watches per user; memory use depends on the kernel and workload.
fs.inotify.max_user_watches = 524288

########## Devices ##########

# Require CAP_SYS_MODULE to autoload TTY line-discipline modules.
dev.tty.ldisc_autoload = 0

# Require CAP_SYS_ADMIN for TIOCSTI input injection; some accessibility tools may be affected.
dev.tty.legacy_tiocsti = 0

# Block new USB device enumeration; requires linux-hardened or another supporting kernel.
# Devices connected or re-enumerated afterward may be unavailable.
#kernel.deny_new_usb = 1

########## Networking ##########

# Allow larger input backlogs for measured receive bursts, at a memory and latency cost.
#net.core.netdev_max_backlog = 16384

# Raise generic socket buffer defaults for workloads that need larger queues.
# TCP has separate defaults below; larger generic defaults can increase memory use and latency.
#net.core.rmem_default = 8388608
#net.core.wmem_default = 8388608

# Allow ordinary SO_RCVBUF and SO_SNDBUF requests up to 64 MiB.
# The kernel doubles requested sizes for bookkeeping.
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864

# Use ports 1024-65535 for automatic local TCP and UDP port allocation.
net.ipv4.ip_local_port_range = 1024 65535

########## IPv4 Networking ##########

# Disable IPv4 forwarding before applying interface settings; changing it resets some defaults.
net.ipv4.ip_forward = 0
net.ipv4.conf.default.forwarding = 0
net.ipv4.conf.*.forwarding = 0

# Reject IPv4 source-routing options.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.*.accept_source_route = 0

# Enforce strict reverse-path validation: the best return route must use the receiving interface.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.*.rp_filter = 1

# Drop unicast IPv4 packets carried in link-layer broadcast or multicast frames.
net.ipv4.conf.all.drop_unicast_in_l2_multicast = 1
net.ipv4.conf.default.drop_unicast_in_l2_multicast = 1
net.ipv4.conf.*.drop_unicast_in_l2_multicast = 1

# Log packets with invalid source or destination addresses.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
net.ipv4.conf.*.log_martians = 1

# Ignore IPv4 ICMP redirects.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.*.accept_redirects = 0

# Restrict redirects to gateways already in the interface's gateway list if redirects are enabled.
net.ipv4.conf.all.secure_redirects = 1
net.ipv4.conf.default.secure_redirects = 1
net.ipv4.conf.*.secure_redirects = 1

# Disable RFC 1620 shared-media redirects, which otherwise override secure_redirects.
net.ipv4.conf.all.shared_media = 0
net.ipv4.conf.default.shared_media = 0
net.ipv4.conf.*.shared_media = 0

# Do not send IPv4 ICMP redirects.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.*.send_redirects = 0

# Prefer a source address appropriate for the target when sending ARP requests.
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.default.arp_announce = 2
net.ipv4.conf.*.arp_announce = 2

# Answer ARP requests only for addresses assigned to the receiving interface.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.default.arp_ignore = 1
net.ipv4.conf.*.arp_ignore = 1

# Drop gratuitous ARP packets; this does not prevent all ARP spoofing.
net.ipv4.conf.all.drop_gratuitous_arp = 1
net.ipv4.conf.default.drop_gratuitous_arp = 1
net.ipv4.conf.*.drop_gratuitous_arp = 1

# Ignore ICMP echo and timestamp requests addressed to IPv4 broadcast or multicast addresses.
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Suppress warnings about bogus ICMP errors sent in response to broadcast traffic.
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Ignore IPv4 ping requests.
#net.ipv4.icmp_echo_ignore_all = 1

########## IPv6 Networking ##########

# Disable IPv6 packet forwarding.
net.ipv6.conf.all.forwarding = 0
net.ipv6.conf.default.forwarding = 0
net.ipv6.conf.*.forwarding = 0

# Reject Mobile IPv6 type 2 routing headers; SRv6 and RPL are handled separately.
net.ipv6.conf.all.accept_source_route = -1
net.ipv6.conf.default.accept_source_route = -1
net.ipv6.conf.*.accept_source_route = -1

# Reject RPL source-routing headers.
net.ipv6.conf.all.rpl_seg_enabled = 0
net.ipv6.conf.default.rpl_seg_enabled = 0
net.ipv6.conf.*.rpl_seg_enabled = 0

# Reject SRv6 routing headers addressed to this host.
net.ipv6.conf.all.seg6_enabled = 0
net.ipv6.conf.default.seg6_enabled = 0
net.ipv6.conf.*.seg6_enabled = 0

# Ignore IPv6 in-situ telemetry options.
net.ipv6.conf.default.ioam6_enabled = 0
net.ipv6.conf.*.ioam6_enabled = 0

# Drop unicast IPv6 packets carried in link-layer broadcast or multicast frames.
net.ipv6.conf.default.drop_unicast_in_l2_multicast = 1
net.ipv6.conf.*.drop_unicast_in_l2_multicast = 1

# Reject fragmented IPv6 Neighbor Discovery packets.
net.ipv6.conf.default.suppress_frag_ndisc = 1
net.ipv6.conf.*.suppress_frag_ndisc = 1

# Ignore IPv6 ICMP redirects.
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.*.accept_redirects = 0

# Ignore advertised router preferences and Route Information Options.
net.ipv6.conf.default.accept_ra_rtr_pref = 0
net.ipv6.conf.*.accept_ra_rtr_pref = 0

# Learn the default router and advertised hop limit from router advertisements.
net.ipv6.conf.default.accept_ra_defrtr = 1
net.ipv6.conf.*.accept_ra_defrtr = 1

# Learn on-link prefixes and address lifetimes from router advertisements.
net.ipv6.conf.default.accept_ra_pinfo = 1
net.ipv6.conf.*.accept_ra_pinfo = 1

# Limit automatic address creation to 16 addresses per interface, counting link-local addresses.
net.ipv6.conf.default.max_addresses = 16
net.ipv6.conf.*.max_addresses = 16

# Send one Duplicate Address Detection probe before using a new IPv6 address.
net.ipv6.conf.default.accept_dad = 1
net.ipv6.conf.*.accept_dad = 1
net.ipv6.conf.default.dad_transmits = 1
net.ipv6.conf.*.dad_transmits = 1

# Enable temporary IPv6 privacy addresses and prefer them for outgoing connections.
net.ipv6.conf.default.use_tempaddr = 2
net.ipv6.conf.*.use_tempaddr = 2

# Generate private IPv6 interface identifiers, creating a random secret when needed.
net.ipv6.conf.all.addr_gen_mode = 3
net.ipv6.conf.default.addr_gen_mode = 3

# Create IPv6 addresses from advertised prefixes using stateless address autoconfiguration.
net.ipv6.conf.default.autoconf = 1
net.ipv6.conf.*.autoconf = 1

# Keep retrying router solicitations with backoff until a router advertisement is received.
net.ipv6.conf.default.router_solicitations = -1
net.ipv6.conf.*.router_solicitations = -1

# Accept router advertisements while IPv6 forwarding is disabled.
net.ipv6.conf.default.accept_ra = 1
net.ipv6.conf.*.accept_ra = 1

# Ignore all IPv6 echo requests, or only those sent to anycast and multicast addresses.
#net.ipv6.icmp.echo_ignore_all = 1
#net.ipv6.icmp.echo_ignore_anycast = 1
#net.ipv6.icmp.echo_ignore_multicast = 1

########## TCP Networking ##########

# Use SYN cookies when the TCP SYN backlog overflows to resist SYN floods.
net.ipv4.tcp_syncookies = 1

# Ignore RST packets for TIME-WAIT connections to mitigate TIME-WAIT assassination (RFC 1337).
net.ipv4.tcp_rfc1337 = 1

# Disable TCP timestamp negotiation to reduce the enabled protocol features.
# This also removes timestamp-based round-trip measurements and wrapped-sequence protection.
#net.ipv4.tcp_timestamps = 0

# Disable selective and duplicate acknowledgments to reduce TCP option processing.
# Loss recovery and throughput can suffer; DSACK is already inactive when SACK is disabled.
#net.ipv4.tcp_sack = 0
#net.ipv4.tcp_dsack = 0

# Enable TCP MTU probing after a suspected path MTU black hole.
net.ipv4.tcp_mtu_probing = 1

# Start TCP keepalive probes after 120 idle seconds on sockets with keepalive enabled.
net.ipv4.tcp_keepalive_time = 120

# Use BBR congestion control with fq_codel as the default queueing discipline.
net.core.default_qdisc = fq_codel
net.ipv4.tcp_congestion_control = bbr

# Set TCP buffer minimum, initial size, and autotuning maximum, in bytes.
# Allow buffers to grow to 512 MiB for high-bandwidth, high-latency connections as memory permits.
# Reference: https://blog.cloudflare.com/optimizing-tcp-for-high-throughput-and-low-latency/
net.ipv4.tcp_rmem = 8192 262144 536870912
net.ipv4.tcp_wmem = 4096 16384 536870912

# Use a 128 KiB unsent-data threshold for TCP write readiness and send buffering.
# Disabled by default: this threshold caused outgoing uploads through pasta to stall with BBR.
#net.ipv4.tcp_notsent_lowat = 131072
